name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # volledige geschiedenis: het wijzigingslog van de voorwaarden leest oudere versies
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run controle
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
