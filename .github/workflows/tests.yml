name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    # Vast op 24.04: ubuntu-latest is inmiddels 26.04 en daar installeert Playwright 1.56 geen Chromium.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # volledige geschiedenis: het wijzigingslog van de voorwaarden leest oudere versies
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run controle
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
