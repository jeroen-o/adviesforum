name: Externe links controleren
on:
  schedule:
    - cron: '17 6 * * 1'   # elke maandag
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 4 --retry-wait-time 5 --accept 200,202,204,206,403,429,500,502,503 --exclude-path '404.html' './*.html' './data/**/*.js'
          fail: true
  bronnen:
    # Bronlinks achter de voorwaarden (docs/bronnen-urls.txt, gegenereerd door tools/bronnen-lijst.js).
    # Faalt niet: veel sites van aanbieders weren robots. Het rapport staat in de samenvatting van de run en als artefact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 4 --retry-wait-time 5 --max-concurrency 8 --accept 200,202,204,206,403,429,500,502,503 './docs/bronnen-urls.txt'
          output: ./lychee/bronnen.md
          jobSummary: true
          fail: false
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-bronlinks
          path: ./lychee/bronnen.md
