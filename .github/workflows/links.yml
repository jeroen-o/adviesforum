name: Externe links controleren
on:
  schedule:
    - cron: '17 6 * * 1'   # elke maandag
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail --max-retries 2 --accept 200,206,403,429 './*.html' './data/**/*.js'
          fail: true
